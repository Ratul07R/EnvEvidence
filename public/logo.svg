<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#logoGradient)" opacity="0.08"/>
  
  <!-- Main hexagon representing structured data/network -->
  <polygon points="256,80 360,140 360,260 256,320 152,260 152,140" fill="url(#logoGradient)" opacity="0.9"/>
  
  <!-- Inner hexagon -->
  <polygon points="256,110 335,158 335,254 256,302 177,254 177,158" fill="white" opacity="0.15"/>
  
  <!-- Data visualization lines -->
  <line x1="190" y1="200" x2="322" y2="200" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="190" y1="200" x2="230" y2="160" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="230" y1="160" x2="280" y2="180" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="280" y1="180" x2="322" y2="200" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Data points -->
  <circle cx="190" cy="200" r="8" fill="white"/>
  <circle cx="230" cy="160" r="6" fill="white" opacity="0.8"/>
  <circle cx="280" cy="180" r="6" fill="white" opacity="0.8"/>
  <circle cx="322" cy="200" r="8" fill="white"/>
  
  <!-- Verification checkmark -->
  <path d="M 210 230 L 240 260 L 302 220" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Globe representation -->
  <ellipse cx="256" cy="356" rx="120" ry="40" stroke="url(#logoGradient)" stroke-width="3" fill="none" opacity="0.6"/>
  <ellipse cx="256" cy="356" rx="120" ry="40" stroke="url(#logoGradient)" stroke-width="3" fill="none" opacity="0.4" transform="rotate(45 256 356)"/>
  <ellipse cx="256" cy="356" rx="120" ry="40" stroke="url(#logoGradient)" stroke-width="3" fill="none" opacity="0.4" transform="rotate(90 256 356)"/>
  
  <!-- Brand text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="url(#logoGradient)" letter-spacing="2">ENVEVIDENCE</text>
</svg>